<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1e214f" />
        <meta name="description" content="A full-screen animated day and night cycle." />
        <title>Day / Night Cycle</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="hero.css" />
    </head>

    <body>
    <main id="hero" aria-label="Animated day and night cycle">
            <div class="hero__animation">
                <div id="background-sunrise" class="background"></div>
                <div id="background-sunset" class="background"></div>
                <div id="background-day" class="background"></div>
                <div id="background-nightrise" class="background"></div>
                <div id="background-night" class="background"></div>
                <div id="background-nightset" class="background"></div>
                <div id="sun" class="movingObject" aria-hidden="true">
                    <div id="sun-wrapper">
                        <div id="sun-core"></div>
                        <div class="sun-ray" id="sun-ray-1"></div>
                        <div class="sun-ray" id="sun-ray-2"></div>
                        <div class="sun-ray" id="sun-ray-3"></div>
                    </div>
                </div>
                <div id="moon" class="movingObject" aria-hidden="true">
                    <div id="moon-wrapper">
                        <div id="moon-core"></div>
                        <div class="moon-ray" id="moon-ray-1"></div>
                        <div class="moon-ray" id="moon-ray-2"></div>
                        <div class="moon-ray" id="moon-ray-3"></div>
                    </div>
                </div>
                <div id="clouds" aria-hidden="true"></div>
                <div id="stars" aria-hidden="true"></div>
                <div class="hero__wave" aria-hidden="true"></div>
        </div>
    </main>
    <div class="speed-control" aria-label="Simulation speed control">
        <label for="speed-slider">Speed <output id="speed-value" for="speed-slider">1×</output></label>
        <input id="speed-slider" type="range" min="1" max="8" step="0.25" value="1"
            aria-label="Simulation speed">
    </div>
    <script src="index.js"></script>
</body>
</html>
